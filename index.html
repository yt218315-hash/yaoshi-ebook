<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藥師琉璃光如來本願功德經｜電子書</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:serif;background:#eeeae2;color:#333}.header{height:58px;background:#f8f6f1;border-bottom:1px solid #d8d2c7;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.title{font-size:18px;letter-spacing:2px}.viewer{height:calc(100% - 58px);position:relative;display:flex;align-items:center;justify-content:center;padding:20px 70px 70px}.book{position:relative;height:min(82vh,760px);aspect-ratio:595/842;filter:drop-shadow(0 16px 25px rgba(0,0,0,.2))}.page{position:absolute;inset:0;background:#fff;transform-origin:left center;backface-visibility:hidden;border:1px solid #d8d2c8;overflow:hidden;transition:transform .65s}.page img{width:100%;height:100%;object-fit:contain}.turned{transform:rotateY(-180deg)}button{cursor:pointer}.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:88px;border:0;border-radius:8px;background:#4d483f;color:white;font-size:32px;z-index:5}.prev{left:15px}.next{right:15px}.bottom{position:absolute;bottom:0;left:0;right:0;height:62px;background:#f8f6f1;border-top:1px solid #d8d2c7;display:flex;align-items:center;gap:10px;padding:7px 12px}.thumbs{display:flex;gap:5px;overflow:auto;flex:1}.thumb{width:32px;height:44px;object-fit:cover;opacity:.6;border:1px solid #aaa}.active{opacity:1;border:2px solid #555}.btn{height:36px;background:white;border:1px solid #ccc;border-radius:6px;padding:0 9px}.counter{min-width:55px;text-align:center;font:13px sans-serif}@media(max-width:700px){.title{font-size:14px}.viewer{padding:10px 50px 68px}.nav{width:40px;height:70px}.prev{left:5px}.next{right:5px}}</style></head><body><header class="header"><div class="title">藥師琉璃光如來本願功德經</div><div>電子書・20 頁</div></header><main class="viewer" id="viewer"><button class="nav prev" id="prev">‹</button><div class="book" id="book"><div style="font-family:sans-serif;text-align:center;padding-top:40vh">正在載入電子書…</div></div><button class="nav next" id="next">›</button><div class="bottom"><button class="btn" id="first">首頁</button><div class="thumbs" id="thumbs"></div><div class="counter" id="counter">1 / 20</div><button class="btn" id="last">末頁</button><button class="btn" id="full">全螢幕</button></div></main><script>const N=20,book=document.getElementById('book'),thumbs=document.getElementById('thumbs'),counter=document.getElementById('counter'),viewer=document.getElementById('viewer');let page=1;function render(){document.querySelectorAll('.page').forEach((e,i)=>e.classList.toggle('turned',i<page-1));document.querySelectorAll('.thumb').forEach((e,i)=>e.classList.toggle('active',i===page-1));counter.textContent=`${page} / ${N}`}function go(n){page=Math.max(1,Math.min(N,n));render()}prev.onclick=()=>go(page-1);next.onclick=()=>go(page+1);first.onclick=()=>go(1);last.onclick=()=>go(N);full.onclick=()=>document.documentElement.requestFullscreen?.();document.onkeydown=e=>{if(e.key==='ArrowLeft')go(page-1);if(e.key==='ArrowRight')go(page+1)};let sx=null;viewer.ontouchstart=e=>sx=e.changedTouches[0].clientX;viewer.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)go(page+(dx<0?1:-1))};(async()=>{try{const zip=await JSZip.loadAsync(await (await fetch('ebook-pages.zip')).arrayBuffer());book.innerHTML='';for(let i=1;i<=N;i++){const name=Object.keys(zip.files).find(x=>x.endsWith(`pages/page-${String(i).padStart(2,'0')}.jpg`));if(!name)throw new Error('missing page');const blob=await zip.files[name].async('blob');const url=URL.createObjectURL(blob);const el=document.createElement('div');el.className='page';el.style.zIndex=N-i+1;const im=document.createElement('img');im.src=url;el.appendChild(im);book.appendChild(el);const th=im.cloneNode();th.className='thumb';th.onclick=()=>go(i);thumbs.appendChild(th)}render()}catch(e){book.innerHTML='<div style="font-family:sans-serif;text-align:center;padding:30vh 20px">電子書載入失敗，請重新整理頁面。</div>'}})();</script></body></html>
